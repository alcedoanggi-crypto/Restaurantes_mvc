{% extends 'base.html' %}
{% block guest %}
<div class="login-wrap"><div class="login-bg"></div>
  <div class="login-card text-center">
    <h1>{{ code }}</h1>
    <p>{{ msg }}</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-entrar w-100">Volver</a>
  </div>
</div>
{% endblock %}
{% block content %}
<div class="text-center py-5">
  <h1 class="display-4 serif text-tomate">{{ code }}</h1>
  <p class="lead">{{ msg }}</p>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-tomate btn-pos">Volver al inicio</a>
</div>
{% endblock %}
